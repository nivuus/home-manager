# Structure only. Names and descriptions are in translations/<language>.json
# (key "services"), so that each person reads them in their own language:
# text written here would be shown as is to everyone.
send_event:
  fields:
    text:
      required: true
      example: "Remember to replace the batteries of the kitchen sensor."
      selector:
        text:
          multiline: true
    persona:
      required: false
      example: Hestia
      selector:
        text:
    event_type:
      required: false
      example: ha_automation
      selector:
        text:

send_feedback:
  fields:
    entity_id:
      required: true
      example: ha_notification
      selector:
        text:
    event_type:
      required: true
      example: persistent_notification
      selector:
        text:
    accepted:
      required: false
      default: true
      selector:
        boolean:
    suggestion_id:
      required: false
      example: latest
      selector:
        text:
    persona:
      required: false
      example: home-manager
      selector:
        text:
