# MQTT broker of the home-manager package (Mosquitto >= 2.1).
#
# hooks/install.py never overwrites this file: it rewrites it only when it
# recognises, directive for directive, an earlier packaged version (see
# hooks/mqtt_accounts.py). Edit it by hand and later updates leave it alone.
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/data/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe

# Anonymous access is refused on every listener that does not say otherwise.
# Only 8883 says otherwise, with listener_allow_anonymous.
allow_anonymous false

# Accounts, roles and ACLs of 1883, 1884 and 8884: the Dynamic Security
# plugin. One client per device, managed live with mosquitto_ctrl; the plugin
# rewrites the JSON file itself after each change.
# https://mosquitto.org/documentation/dynamic-security/
plugin_load dynsec /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# ACL of the Meross listener only. Loaded here, applied by plugin_use below.
plugin_load meross_acl /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/data/acl_meross

listener 1883
plugin_use dynsec

listener 1884
plugin_use dynsec

# 8883: TLS, required by the Meross bulbs in local mode -- they only speak
# MQTTS over TLS 1.2 and do not validate the CA, hence the self-signed
# certificate. They log in with their MAC address as username, which contains
# ':' and could not be stored in a password file. Hence anonymous access here
# only, confined by acl_meross to the Meross topics. Dynamic Security is NOT
# applied to this listener.
listener 8883
certfile /mosquitto/data/certs/server.crt
keyfile /mosquitto/data/certs/server.key
tls_version tlsv1.2
require_certificate false
listener_allow_anonymous true
plugin_use meross_acl

listener 8884
plugin_use dynsec

user mosquitto
